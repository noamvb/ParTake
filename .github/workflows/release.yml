name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Test
        run: |
          (cd packages/parlvu && dart pub get && dart test)
          flutter pub get
          flutter test
          python3 -m unittest server/test_partake_server.py
      - name: Signing key
        env:
          PARTAKE_KEYSTORE_B64: ${{ secrets.PARTAKE_KEYSTORE_B64 }}
        run: |
          test -n "$PARTAKE_KEYSTORE_B64" || { echo "PARTAKE_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$PARTAKE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PARTAKE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs and web
        env:
          PARTAKE_KEYSTORE_PASSWORD: ${{ secrets.PARTAKE_KEYSTORE_PASSWORD }}
          PARTAKE_KEY_ALIAS: ${{ secrets.PARTAKE_KEY_ALIAS }}
          PARTAKE_KEY_PASSWORD: ${{ secrets.PARTAKE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "${{ github.run_number }}"
          flutter build web --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            cp "$f" "dist/partake-$VERSION-$(basename "$f" | sed 's/^app-//; s/-release\.apk$//').apk"
          done
          (cd build && tar czf "../dist/partake-web-$VERSION.tar.gz" web)
          ls -la dist
      - name: Verify signature
        run: |
          ls "$ANDROID_HOME/build-tools/"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" > certs.txt 2>&1 || { cat certs.txt; exit 1; }
            grep -E 'certificate (DN|SHA-256)' certs.txt || cat certs.txt
            grep -q 'CN=ParTake' certs.txt || { echo "$apk is not signed with the ParTake release key"; exit 1; }
            # Resource shrinking once stripped these; without them background audio breaks.
            "$(dirname "$APKSIGNER")/aapt2" dump resources "$apk" | grep -q 'drawable/audio_service_pause' || { echo "$apk lost audio_service icons to resource shrinking"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
